/* Layout: 56px app bar + 224px flat side nav + content; neutral surfaces, hairline borders, one accent. Charts: ECharts. Icons: Lucide. */
:root{

  --accent:#A78BFA; --accent-hover:#C4B1FC; --accent-soft:#272042; --accent-fg:#14101F;
  --ok:#4ADE80; --ok-soft:#14301F; --warn:#FBBF24; --warn-soft:#352810; --crit:#F87171; --crit-soft:#3A1A1A; --info:#60A5FA;
  --ch-1:#A78BFA; --ch-2:#6D5BB8; --ch-3:#60A5FA; --ch-4:#2DD4BF; --ch-5:#FBBF24; --ch-6:#F87171; --ch-grid:#262B35; --ch-text:#858B99;

}

.btn{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:4px;border:1px solid var(--line-2);background:var(--panel);color:var(--fg);font-weight:500;cursor:pointer;white-space:nowrap}

.grid{display:grid;gap:16px} .panel{background:var(--panel);border:1px solid var(--line);border-radius:4px;min-width:0}

.st.HIGH,.st.crit{color:var(--crit)} .st.MEDIUM,.st.warn{color:var(--warn)} .st.LOW,.st.ok{color:var(--ok)} .st.muted{color:var(--fg-3)}
.tag{display:inline-flex;align-items:center;font-family:var(--mono);font-size:11px;border:1px solid var(--line-2);border-radius:3px;padding:1px 6px;color:var(--fg-2);background:var(--panel);white-space:nowrap}
.tag.HIGH{border-color:color-mix(in srgb,var(--crit) 45%,transparent);color:var(--crit);background:var(--crit-soft)} .tag.MEDIUM{border-color:color-mix(in srgb,var(--warn) 45%,transparent);color:var(--warn);background:var(--warn-soft)} .tag.LOW{border-color:color-mix(in srgb,var(--ok) 45%,transparent);color:var(--ok);background:var(--ok-soft)}

.esc{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;color:var(--crit)}

/* toolbar + table */

.ctl{display:flex;flex-direction:column;gap:3px} .ctl label{font-size:10.5px;color:var(--fg-3);font-weight:500}

.ctl.search{position:relative} .ctl.search svg{position:absolute;left:8px;bottom:7px;width:14px;height:14px;color:var(--fg-3)} .ctl.search input{padding-left:28px}

.tw{overflow:x auto;overflow-x:auto} table{width:100%;border-collapse:collapse;min-width:760px}

.rowid{font-family:var(--mono);font-size:12px;font-weight:500}
.rowgo{display:inline-flex;align-items:center;gap:4px;color:var(--accent);font-weight:500;font-size:12px;white-space:nowrap} .rowgo svg{width:14px;height:14px}
.hint{display:inline-flex;align-items:center;gap:6px;color:var(--fg-3);font-size:12px} .hint svg{width:14px;height:14px}
.casehead{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px} .casehead .id{font-family:var(--mono);font-size:14px;font-weight:600}

/* key-value, lists */
.kv{display:grid;grid-template-columns:140px 1fr;gap:7px 12px;font-size:12.5px} .kv dt{color:var(--fg-3)} .kv dd{margin:0;color:var(--fg)}
.vlist{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.vlist li{border:1px solid var(--line);border-radius:4px;padding:9px 11px;display:grid;grid-template-columns:auto 1fr;gap:4px 10px;align-items:start}

.aihead{display:flex;align-items:center;gap:8px} .aihead svg{color:var(--accent)} .aihead .state{margin-left:auto;font-size:11px;color:var(--fg-3);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);padding:0 14px} .tabs button{border:0;background:transparent;color:var(--fg-3);font-weight:500;padding:9px 10px;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px} .tabs button.on{color:var(--fg);border-bottom-color:var(--accent)}

.step.run .dot{border-color:var(--accent);color:var(--accent)} .step.done .dot{background:var(--ok);border-color:var(--ok);color:#fff} .step.skip .dot{border-style:dashed}
.step .nm{font-weight:500} .step .ds{font-size:11.5px;color:var(--fg-3)} .step .stt{font-size:11px;color:var(--fg-3);text-transform:uppercase;letter-spacing:.05em;font-weight:600} .step.done .stt{color:var(--ok)} .step.run .stt{color:var(--accent)}

.drawer{position:fixed;top:0;right:0;height:100%;width:min(640px,100%);background:var(--bg);z-index:80;box-shadow:var(--shadow-drawer);transform:translateX(100%);transition:transform .22s ease-out;display:flex;flex-direction:column;border-left:1px solid var(--line)}

<script>

/* Data is loaded from data/data.js (built from the CSVs by scripts/csv_to_dashboard.py; not in git). */
var RAW = window.FRAUDSPECT_DATA || {claims:[],providers:[],members:[]};

/* ======================= real taxonomy, rules, scoring (ported from backend) ======================= */
var FLAG_META={UPCODING:"Upcoding",PHANTOM_BILLING:"Phantom billing",DUPLICATE_CLAIM:"Duplicate claim",UNNECESSARY_PROCEDURE:"Unnecessary procedure",ABNORMAL_PRESCRIBING:"Abnormal prescribing",CONTRAINDICATION:"Contraindication",DOCTOR_SHOPPING:"Doctor shopping",REFERRAL_LOOP:"Referral loop",CONTROLLED_DRUG_ABUSE:"Controlled drug abuse",BURST_BILLING:"Burst billing"};
var RULE_META={"CHI-001":"Prohibited CPT combination","CHI-002":"Pediatric-only CPT for adult","CHI-003":"Duplicate billing (30 days)","CHI-004":"Controlled substance limit exceeded","CHI-005":"Insulin without A1C monitoring","CHI-006":"Excessive bronchodilator billing","CHI-007":"Methotrexate + NSAID without CBC","CHI-008":"Repeat colonoscopy within 12 months","CHI-009":"Antiviral beyond 5 days","CHI-010":"Doctor shopping","CSV-MEMBER-001":"Very high member utilization","CSV-MEMBER-002":"Elevated member utilization","CSV-CLAIM-001":"High-value claim","CSV-CLAIM-002":"Elevated claim amount","CSV-CLAIM-003":"High service count","CSV-CLAIM-004":"Non-standard claim status","CSV-PROVIDER-001":"Provider licence not active","CSV-PROVIDER-002":"Extreme provider claim volume","CSV-PROVIDER-003":"Elevated provider claim volume"};
var SEV_SCORE={HIGH:100,MEDIUM:60,LOW:30}, WEIGHTS={llm:0.40,rule:0.35,graph:0.25};
function V(id,sev,desc,ev){return {rule_id:id,severity:sev,description:desc,evidence:ev};}
function fraudScore(llm,viols,graph){
  var llmScore=+(llm&&llm.llm_risk_score)||0, ruleScore=viols.length?Math.max.apply(null,viols.map(function(v){return SEV_SCORE[v.severity]||30;})):0, graphScore=+(graph&&graph.graph_risk_score)||0;
  var final_=Math.round(Math.min(100,llmScore*WEIGHTS.llm+ruleScore*WEIGHTS.rule+graphScore*WEIGHTS.graph)*100)/100;
  var cat=final_>=70?"HIGH":final_>=40?"MEDIUM":"LOW"; if(viols.some(function(v){return v.severity==="HIGH";})&&cat==="LOW")cat="MEDIUM";
  var flags=[];(llm&&llm.fraud_flags||[]).forEach(function(f){if(flags.indexOf(f)<0)flags.push(f);});viols.forEach(function(v){if(flags.indexOf(v.rule_id)<0)flags.push(v.rule_id);});
  if(graph&&graph.referral_loop&&flags.indexOf("REFERRAL_LOOP")<0)flags.push("REFERRAL_LOOP"); if(graph&&graph.burst_detected&&flags.indexOf("BURST_BILLING")<0)flags.push("BURST_BILLING");
  return {final_score:final_,risk_category:cat,fraud_flags:flags,escalate:cat==="HIGH",breakdown:{llm:llmScore,rule:ruleScore,graph:graphScore,llm_w:llmScore*WEIGHTS.llm,rule_w:ruleScore*WEIGHTS.rule,graph_w:graphScore*WEIGHTS.graph}};
}
function csvRules(kind,r){var v=[];
  if(kind==="member"){if(r.visits>=100)v.push(V("CSV-MEMBER-001","HIGH","Very high patient healthcare utilization","Member profile reports "+r.visits+" healthcare visits"));else if(r.visits>=50)v.push(V("CSV-MEMBER-002","MEDIUM","Elevated patient healthcare utilization","Member profile reports "+r.visits+" healthcare visits"));}
  else if(kind==="claim"){if(r.amt>=5000)v.push(V("CSV-CLAIM-001","HIGH","High-value claim summary","Claim net amount is "+r.amt.toFixed(2)));else if(r.amt>=2500)v.push(V("CSV-CLAIM-002","MEDIUM","Elevated claim amount","Claim net amount is "+r.amt.toFixed(2)));
    if(r.sv>=10)v.push(V("CSV-CLAIM-003","MEDIUM","High number of services in one claim",r.sv+" services rendered in the claim")); if(r.status&&["N","A","APPROVED"].indexOf(r.status.toUpperCase())<0)v.push(V("CSV-CLAIM-004","LOW","Non-standard claim status","Claim status is "+r.status));}
  else if(kind==="provider"){if(r.lic&&r.lic.toUpperCase()!=="A")v.push(V("CSV-PROVIDER-001","HIGH","Provider licensing status is not active","Licensing status is "+r.lic)); if(r.vol>=100000)v.push(V("CSV-PROVIDER-002","HIGH","Extreme provider claim volume","Provider profile reports "+r.vol+" claims"));else if(r.vol>=50000)v.push(V("CSV-PROVIDER-003","MEDIUM","Elevated provider claim volume","Provider profile reports "+r.vol+" claims"));}
  return v;}
var NO_LLM={extracted:{},checks:{},fraud_flags:[],llm_risk_score:0,overall_risk:"unknown",rationale:["LLM skipped for CSV bulk import"]};
var NO_GRAPH={centrality_score:0,referral_loop:false,burst_detected:false,graph_risk_score:0,skipped_reason:"Graph analytics skipped for CSV bulk import"};
var CLAIMS=[],PROVS=[],MEMS=[];
(function(){RAW.claims.forEach(function(a){var r={id:a[0],type:a[1],status:a[2],amt:a[3],sv:a[4],date:a[5]};r.viol=csvRules("claim",r);r.sc=fraudScore(NO_LLM,r.viol,NO_GRAPH);CLAIMS.push(r);});
  RAW.providers.forEach(function(a){var r={id:a[0],lic:a[1],city:a[2],region:a[3],type:a[4],vol:a[5]};r.viol=csvRules("provider",r);r.sc=fraudScore(NO_LLM,r.viol,NO_GRAPH);PROVS.push(r);});
  RAW.members.forEach(function(a){var r={id:a[0],g:a[1],city:a[2],region:a[3],policy:a[4],age:a[5],visits:a[6],chronic:a[7],dm:a[8],htn:a[9],cad:a[10],dys:a[11],thy:a[12]};r.viol=csvRules("member",r);r.sc=fraudScore(NO_LLM,r.viol,NO_GRAPH);MEMS.push(r);});})();
var LIC={A:"Active",H:"On hold",C:"Cancelled"}, STATUS={N:"Normal",J:"Rejected / non-standard"}, AGE_MID={"0-18":9,"19-30":24,"31-45":38,"46-60":53,"61+":65};

/* ======================= helpers ======================= */
var $=function(s,r){return (r||document).querySelector(s);};
function el(t,c,h){var e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e;}
function esc_(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
function sar(n){return new Intl.NumberFormat("en-US",{maximumFractionDigits:0}).format(n);}
function kfmt(n){return n>=1e6?(n/1e6).toFixed(2)+"M":n>=1e3?(n/1e3).toFixed(n>=1e5?0:1)+"k":String(n);}
function icons(){try{if(window.lucide)lucide.createIcons();}catch(e){}}
function ic(n,extra){return '<i data-lucide="'+n+'"'+(extra||"")+'></i>';}
function cssv(v){return getComputedStyle(document.documentElement).getPropertyValue(v).trim();}
function st(cat,label){return '<span class="st '+cat+'">'+(label||cat.charAt(0)+cat.slice(1).toLowerCase())+'</span>';}
function tag(t,cls){return '<span class="tag '+(cls||"")+'">'+esc_(t)+'</span>';}
function flagTag(f){return FLAG_META[f]?tag(FLAG_META[f],"flag"):'<span class="tag" title="'+esc_(RULE_META[f]||"")+'">'+f+'</span>';}
function scoreCell(sc){var col=sc.risk_category==="HIGH"?"--crit":sc.risk_category==="MEDIUM"?"--warn":"--ok";return '<span class="score"><b>'+sc.final_score.toFixed(0)+'</b><span class="bar"><i style="width:'+sc.final_score+'%;background:var('+col+')"></i></span>'+st(sc.risk_category)+'</span>';}
function hitsCell(v){return v.length?'<div class="tagset">'+v.map(function(x){return tag(x.rule_id,x.severity);}).join("")+'</div>':'<span class="muted">—</span>';}
function violList(viols){if(!viols.length)return '<div class="callout ok">No rule violation. Amount, services, status, licence and utilization are within the configured thresholds.</div>';
  return '<ul class="vlist">'+viols.map(function(v){return '<li><span class="vid">'+v.rule_id+'</span>'+st(v.severity)+'<span class="vd">'+esc_(v.description)+'</span><span class="ve">'+esc_(v.evidence)+'</span></li>';}).join("")+'</ul>';}
function breakdown(sc,skipped){var b=sc.breakdown;function row(l,w,max,col,note){return '<span>'+l+'</span><span class="t"><i style="width:'+(w/max*100)+'%;background:var('+col+')"></i></span><span class="n"><b>'+w.toFixed(1)+'</b> / '+max+'</span>'+(note?'<span class="note">'+note+'</span>':'');}
  var fc=sc.risk_category==="HIGH"?"--crit":sc.risk_category==="MEDIUM"?"--warn":"--ok";
  return '<div class="bk">'+row("LLM × 0.40",b.llm_w,40,"--ch-1",skipped?"stage skipped on bulk import":"")+row("Rules × 0.35",b.rule_w,35,"--ch-5","")+row("Graph × 0.25",b.graph_w,25,"--ch-3",skipped?"stage skipped on bulk import":"")+'<span style="font-weight:600;border-top:1px solid var(--line);padding-top:6px">Final</span><span class="t" style="border-top:1px solid transparent;margin-top:6px"><i style="width:'+sc.final_score+'%;background:var('+fc+')"></i></span><span class="n" style="padding-top:6px"><b>'+sc.final_score.toFixed(1)+'</b> / 100</span></div>';}
function panel(title,meta,body,acts,cls){return '<section class="panel '+(cls||"")+'"><div class="pt"><div><h2>'+title+'</h2></div><div class="acts">'+(meta?'<span class="meta">'+meta+'</span>':'')+(acts||'')+'</div></div>'+body+'</section>';}

/* ======================= charts (ECharts) ======================= */
var CHARTS=[];
function disposeCharts(){CHARTS.forEach(function(c){try{c.dispose();}catch(e){}});CHARTS=[];}
function theme(){return {text:cssv("--ch-text"),grid:cssv("--ch-grid"),fg:cssv("--fg"),c:[cssv("--ch-1"),cssv("--ch-2"),cssv("--ch-3"),cssv("--ch-4"),cssv("--ch-5"),cssv("--ch-6")],crit:cssv("--crit"),warn:cssv("--warn"),ok:cssv("--ok"),panel:cssv("--panel"),line:cssv("--line-2")};}
function mkChart(id,opt){var e=document.getElementById(id);if(!e)return null;if(!window.echarts){e.innerHTML='<div class="chart-fallback">Chart library unavailable</div>';return null;}
  var t=theme();var ch=echarts.init(e,null,{renderer:"svg"});
  var base={textStyle:{fontFamily:cssv("--font").replace(/"/g,""),color:t.text,fontSize:11},color:t.c,animationDuration:400,
    tooltip:{backgroundColor:t.panel,borderColor:t.line,textStyle:{color:t.fg,fontSize:12},confine:true,extraCssText:"box-shadow:0 4px 16px rgba(0,0,0,.12);border-radius:4px;padding:8px 10px"},
    grid:{left:8,right:12,top:10,bottom:4,containLabel:true}};
  ch.setOption(Object.assign(base,opt),{notMerge:true});CHARTS.push(ch);return ch;}
function axisX(cats,extra){return Object.assign({type:"category",data:cats,axisTick:{show:false},axisLine:{lineStyle:{color:cssv("--ch-grid")}},axisLabel:{color:cssv("--ch-text"),fontSize:11,hideOverlap:true}},extra||{});}
function axisV(extra){return Object.assign({type:"value",splitLine:{lineStyle:{color:cssv("--ch-grid"),type:[2,3]}},axisLabel:{color:cssv("--ch-text"),fontSize:11}},extra||{});}
function hbar(id,items,colorFn){var t=theme();var cats=items.map(function(i){return i[0];}).reverse(),vals=items.map(function(i,ix){return {value:i[1],itemStyle:{color:colorFn?colorFn(i,ix):t.c[0]}};}).reverse();
  mkChart(id,{grid:{left:8,right:36,top:4,bottom:4,containLabel:true},xAxis:axisV({splitLine:{show:false},axisLabel:{show:false}}),yAxis:axisX(cats,{axisLine:{show:false}}),tooltip:{trigger:"item"},
    series:[{type:"bar",data:vals,barMaxWidth:14,label:{show:true,position:"right",color:t.text,fontSize:11,formatter:function(p){return sar(p.value);}}}]});}
function vbar(id,cats,series,opts){var t=theme();opts=opts||{};
  mkChart(id,{xAxis:axisX(cats,opts.xAxis),yAxis:axisV(),tooltip:{trigger:"axis",axisPointer:{type:"shadow"}},legend:series.length>1?{top:0,right:0,textStyle:{color:t.text,fontSize:11},itemWidth:10,itemHeight:10,icon:"roundRect"}:undefined,
    grid:{left:8,right:12,top:series.length>1?28:10,bottom:4,containLabel:true},series:series.map(function(s,i){return Object.assign({type:"bar",barMaxWidth:28,stack:opts.stack?"a":undefined,itemStyle:{color:s.color||t.c[i],borderRadius:[2,2,0,0]}},s);})});}
function donut(id,items){var t=theme();mkChart(id,{tooltip:{trigger:"item",formatter:function(p){return p.name+": <b>"+sar(p.value)+"</b> ("+p.percent+"%)";}},legend:{orient:"vertical",right:0,top:"middle",textStyle:{color:t.text,fontSize:11.5},itemWidth:10,itemHeight:10,icon:"circle",formatter:function(n){var it=items.find(function(i){return i.name===n;});return n+"  "+sar(it.value);}},
  series:[{type:"pie",radius:["58%","82%"],center:["32%","50%"],data:items,label:{show:false},itemStyle:{borderColor:t.panel,borderWidth:2}}]});}
function line(id,xs,ys,peakIdx){var t=theme();mkChart(id,{xAxis:axisX(xs,{boundaryGap:false,axisLabel:{formatter:function(v){return v.slice(5);},interval:4}}),yAxis:axisV(),tooltip:{trigger:"axis"},
  series:[{type:"line",data:ys,smooth:.25,symbol:"circle",symbolSize:4,showSymbol:false,lineStyle:{width:2,color:t.c[0]},itemStyle:{color:t.c[0]},areaStyle:{color:{type:"linear",x:0,y:0,x2:0,y2:1,colorStops:[{offset:0,color:t.c[0]+"33"},{offset:1,color:t.c[0]+"00"}]}},
    markPoint:{data:[{coord:[xs[peakIdx],ys[peakIdx]],symbol:"circle",symbolSize:8,itemStyle:{color:t.c[0],borderColor:t.panel,borderWidth:2},label:{show:true,formatter:"peak "+ys[peakIdx],position:"top",color:t.fg,fontSize:11}}]}}]});}
function hist(id,vals,edges,hotFrom){var t=theme();var bins=edges.map(function(){return 0;});vals.forEach(function(v){for(var i=edges.length-1;i>=0;i--){if(v>=edges[i]){bins[i]++;break;}}});
  var cats=edges.map(function(e,i){return i<edges.length-1?e+"–"+(edges[i+1]-1):e+"+";});
  mkChart(id,{xAxis:axisX(cats,{axisLabel:{interval:0,rotate:cats.length>10?35:0}}),yAxis:axisV(),tooltip:{trigger:"axis",axisPointer:{type:"shadow"}},series:[{type:"bar",barMaxWidth:26,data:bins.map(function(b,i){return {value:b,itemStyle:{color:edges[i]>=hotFrom?t.crit:t.c[0],borderRadius:[2,2,0,0]}};})}]});}
window.addEventListener("resize",function(){CHARTS.forEach(function(c){try{c.resize();}catch(e){}});});

/* ======================= AI (sample capability) ======================= */
var _sample,_tried=false;
/* AI runtime: the claude.ai artifact runtime when present; otherwise the deployment's own /api/ai endpoint (Vercel serverless → Groq, same model as the backend). */
function makeRemoteSample(){
  var fn=async function(input,opts){opts=opts||{};var messages=typeof input==="string"?[{role:"user",content:input}]:input.slice();var tools=opts.tools||[];
    var toolDefs=tools.map(function(t){return {type:"function",function:{name:t.name,description:t.description,parameters:t.inputSchema||{type:"object",properties:{}}}};});
    for(var round=0;round<6;round++){
      var r=await fetch("/api/ai",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({messages:messages,tools:toolDefs})});
      if(!r.ok){var err={};try{err=await r.json();}catch(e){}throw {code:r.status===429?"rate_limited":r.status===503?"not_granted":"error",message:err.error||r.statusText};}
      var j=await r.json(),m=j.message||{};messages.push(m);
      if(m.tool_calls&&m.tool_calls.length){
        for(var i=0;i<m.tool_calls.length;i++){var tc=m.tool_calls[i],t=tools.find(function(x){return x.name===tc.function.name;}),out;
          try{out=t?await t.execute(JSON.parse(tc.function.arguments||"{}")):{error:"unknown tool"};}catch(e){out={error:String(e&&e.message||e)};}
          messages.push({role:"tool",tool_call_id:tc.id,content:JSON.stringify(out)});}
        continue;}
      var text=m.content||"";if(opts.onText)opts.onText({text:text,delta:text});return {text:text,truncated:false};}
    throw {code:"error",message:"tool loop exceeded"};};
  fn.limits=async function(){return {images:false};};return fn;}
async function getSample(){if(_tried)return _sample;_tried=true;
  try{_sample=(window.claude&&claude.use)?await claude.use("sample"):null;}catch(e){_sample=null;}
  if(!_sample){try{var r=await fetch("/api/ai",{method:"GET"});if(r.ok){var j=await r.json();if(j&&j.ok){_sample=makeRemoteSample();var hp=document.querySelector(".env");if(hp&&j.model)hp.innerHTML="<i></i>AI online · "+esc_(j.model);}}}catch(e){}}
  return _sample;}
var REASONER_PROMPT='You are a medical fraud detection AI specializing in healthcare claim analysis.\nAnalyze the provided healthcare claim and return a structured JSON assessment.\n\nEvaluate:\n1. Diagnosis-treatment consistency\n2. Medication dose plausibility\n3. Contraindications between medications\n4. Care pathway validity\n5. Fraud indicators (upcoding, phantom billing, unnecessary procedures)\n\nReturn ONLY valid JSON with this exact schema:\n{\n  "extracted": {"key_findings": []},\n  "checks": {\n    "diagnosis_treatment_match": true,\n    "dose_plausible": true,\n    "contraindications": [],\n    "care_pathway_valid": true\n  },\n  "fraud_flags": [],\n  "llm_risk_score": 0,\n  "overall_risk": "low",\n  "rationale": []\n}\n\nfraud_flags options: UPCODING, PHANTOM_BILLING, DUPLICATE_CLAIM, UNNECESSARY_PROCEDURE,\nABNORMAL_PRESCRIBING, CONTRAINDICATION, DOCTOR_SHOPPING, REFERRAL_LOOP, CONTROLLED_DRUG_ABUSE\n\noverall_risk: low, medium, or high\nllm_risk_score: integer 0-100';
function parseReasoner(text){try{var m=text.match(/\{[\s\S]*\}/);if(m){var d=JSON.parse(m[0]);return {extracted:d.extracted||{},checks:d.checks||{},fraud_flags:d.fraud_flags||[],llm_risk_score:+d.llm_risk_score||0,overall_risk:d.overall_risk||"unknown",rationale:d.rationale||[]};}}catch(e){}return null;}
async function runReasoner(payload,onText){var sm=await getSample();if(!sm)return {ok:false,reason:"unavailable"};
  try{var r=await sm(REASONER_PROMPT+"\n\nAnalyze this healthcare claim:\n"+JSON.stringify(payload,null,2),{modelTier:"default",cache:true,onText:onText});var p=parseReasoner(r.text||"");return p?{ok:true,result:p}:{ok:false,reason:"unparseable"};}catch(e){return {ok:false,reason:e&&e.code||"error"};}}

/* ======================= stats ======================= */
function cnt(arr,f){var m={};arr.forEach(function(x){var k=f(x);m[k]=(m[k]||0)+1;});return m;}
function stats(){var s={};
  s.claims={n:CLAIMS.length,value:CLAIMS.reduce(function(a,c){return a+c.amt;},0),inpatient:CLAIMS.filter(function(c){return c.type==="I";}).length,rejected:CLAIMS.filter(function(c){return c.status!=="N";}).length,high:CLAIMS.filter(function(c){return c.viol.some(function(v){return v.severity==="HIGH";});}).length,flagged:CLAIMS.filter(function(c){return c.viol.length;}).length,flaggedValue:CLAIMS.filter(function(c){return c.viol.length;}).reduce(function(a,c){return a+c.amt;},0)};
  s.prov={n:PROVS.length,nonActive:PROVS.filter(function(p){return p.lic!=="A";}).length,extreme:PROVS.filter(function(p){return p.vol>=100000;}).length,elevated:PROVS.filter(function(p){return p.vol>=50000&&p.vol<100000;}).length,flagged:PROVS.filter(function(p){return p.viol.length;}).length,byRegion:cnt(PROVS,function(p){return p.region;}),byType:cnt(PROVS,function(p){return p.type;})};
  s.mem={n:MEMS.length,veryHigh:MEMS.filter(function(m){return m.visits>=100;}).length,elevated:MEMS.filter(function(m){return m.visits>=50&&m.visits<100;}).length,chronic:MEMS.filter(function(m){return m.chronic;}).length,flagged:MEMS.filter(function(m){return m.viol.length;}).length,byRegion:cnt(MEMS,function(m){return m.region;}),byAge:cnt(MEMS,function(m){return m.age;}),byPolicy:cnt(MEMS,function(m){return m.policy;}),
    cond:{Diabetes:MEMS.filter(function(m){return m.dm;}).length,Hypertension:MEMS.filter(function(m){return m.htn;}).length,Dyslipidemia:MEMS.filter(function(m){return m.dys;}).length,"Thyroid disease":MEMS.filter(function(m){return m.thy;}).length,CAD:MEMS.filter(function(m){return m.cad;}).length}};
  s.ruleHits={};[CLAIMS,PROVS,MEMS].forEach(function(arr){arr.forEach(function(r){r.viol.forEach(function(v){s.ruleHits[v.rule_id]=(s.ruleHits[v.rule_id]||0)+1;});});});return s;}

      panel("AI daily briefing","ClinicalReasoner model",'<div class="pb"><div class="aihead mb" style="margin-bottom:8px">'+ic("sparkles")+'<span class="small muted">Plain-language summary for investigators</span><span class="state" id="brTag">ready</span></div><div class="ai muted" id="brText">Click “AI briefing” to summarize today’s posture across claims, providers and members.</div></div>')+'</div>'+

async function briefing(){var s=stats(),txt=$("#brText"),tagE=$("#brTag"),btn=$("#brBtn");if(!txt)return;
  var fb="Extract covers "+s.claims.n+" claims worth SAR "+sar(s.claims.value)+", "+s.prov.n+" providers and "+s.mem.n+" members. "+s.claims.flagged+" claims hit a rule ("+s.claims.high+" over SAR 5,000), "+s.prov.nonActive+" providers bill on a non-active licence, "+s.prov.extreme+" show extreme volume, and "+s.mem.veryHigh+" members exceed 100 visits. Priority: enable the LLM stage for high-severity rows and add provider/member keys to the claims extract.";
  txt.classList.remove("muted");tagE.textContent="thinking…";var sm=await getSample();if(!sm){txt.textContent=fb;tagE.textContent="offline summary";return;}btn.disabled=true;txt.textContent="";
  var topP=PROVS.filter(function(p){return p.viol.length;}).sort(function(a,b){return b.vol-a.vol;}).slice(0,3).map(function(p){return p.type+" #"+p.id+" in "+p.city+" ("+LIC[p.lic]+", "+sar(p.vol)+" claims)";});
  var prompt="You are a healthcare fraud analyst at Tawuniya (Saudi Arabia). Write a concise 4-sentence daily briefing for investigators in plain English. No preamble.\nData (anonymized extract):\n- Claims: "+s.claims.n+", net SAR "+sar(s.claims.value)+", "+s.claims.inpatient+" inpatient, "+s.claims.rejected+" non-standard status\n- Claims with rule hits: "+s.claims.flagged+" ("+s.claims.high+" high-value >= SAR 5000)\n- Providers: "+s.prov.n+"; non-active licence: "+s.prov.nonActive+"; extreme volume >=100k: "+s.prov.extreme+"; elevated: "+s.prov.elevated+"\n- Top flagged providers: "+topP.join("; ")+"\n- Members: "+s.mem.n+"; 100+ visits: "+s.mem.veryHigh+"; 50-99 visits: "+s.mem.elevated+"; chronic: "+s.mem.chronic+"\n- Caveat: bulk import skips LLM and graph stages so no row can reach HIGH; claims have no provider/member keys.";
  try{var r=await sm(prompt,{modelTier:"quick",cache:true,onText:function(o){txt.textContent=o.text;}});if(r&&r.text)txt.textContent=r.text;tagE.textContent="AI generated";}catch(e){txt.textContent=fb;tagE.textContent=e&&e.code==="rate_limited"?"rate limited":"offline summary";}btn.disabled=false;}

/* ======================= sortable, paged table ======================= */
function tableView(o){var S=o.state;S.page=S.page||1;S.sort=S.sort||o.defaultSort;S.dir=S.dir||-1;var PS=25;
  var cols=o.cols,col=cols.find(function(c){return c.k===S.sort;});var rows=o.rows.slice();if(col&&col.v)rows.sort(function(a,b){var x=col.v(a),y=col.v(b);return (x>y?1:x<y?-1:0)*S.dir;});
  var total=rows.length,pages=Math.max(1,Math.ceil(total/PS));if(S.page>pages)S.page=pages;var slice=rows.slice((S.page-1)*PS,S.page*PS);
  var h=total?'<div class="tw"><table><thead><tr>'+cols.map(function(c){return '<th class="'+(c.r?"r ":"")+(S.sort===c.k?"on":"")+'" data-k="'+c.k+'">'+c.h+(c.v?'<span class="ar">'+(S.sort===c.k?(S.dir>0?"▲":"▼"):"⇅")+'</span>':'')+'</th>';}).join("")+'<th class="r"></th></tr></thead><tbody>'+
    slice.map(function(r){return '<tr data-id="'+esc_(r.id)+'" class="'+(o.selected===r.id?"sel":"")+'">'+cols.map(function(c){return '<td class="'+(c.r?"r":"")+'">'+c.f(r)+'</td>';}).join("")+'<td class="r"><span class="rowgo">'+(o.rowLabel||"View")+ic("chevron-right")+'</span></td></tr>';}).join("")+'</tbody></table></div>'+
    '<div class="pager"><span>'+((S.page-1)*PS+1)+'–'+Math.min(total,S.page*PS)+' of '+sar(total)+'</span><span class="pg"><button class="btn sm ghost" data-pg="-1" '+(S.page<=1?"disabled":"")+'>'+ic("chevron-left")+'</button><span>Page '+S.page+' of '+pages+'</span><button class="btn sm ghost" data-pg="1" '+(S.page>=pages?"disabled":"")+'>'+ic("chevron-right")+'</button></span></div>'
    :'<div class="empty">No rows match the current filters.</div>';
  o.host.innerHTML=h;icons();
  o.host.querySelectorAll("tbody tr").forEach(function(tr){tr.addEventListener("click",function(){o.host.querySelectorAll("tr.sel").forEach(function(x){x.classList.remove("sel");});tr.classList.add("sel");o.onRow(tr.dataset.id);});});
  o.host.querySelectorAll("[data-pg]").forEach(function(b){b.addEventListener("click",function(){S.page+=+b.dataset.pg;tableView(o);});});
  o.host.querySelectorAll("th[data-k]").forEach(function(th){th.addEventListener("click",function(){var c=cols.find(function(x){return x.k===th.dataset.k;});if(!c||!c.v)return;if(S.sort===c.k)S.dir=-S.dir;else{S.sort=c.k;S.dir=-1;}S.page=1;tableView(o);});});}
function sevRank(r){return r.viol.reduce(function(a,v){return Math.max(a,SEV_SCORE[v.severity]);},0);}

  {name:"query_providers",description:"Search provider profiles. Returns id, type, city, region, licence (A active/H hold/C cancelled), claim_volume, score, risk, rule_hits.",inputSchema:{type:"object",properties:{region:{type:"string"},type:{type:"string"},licence:{type:"string",enum:["A","H","C"]},non_active_only:{type:"boolean"},min_volume:{type:"number"},city:{type:"string"},provider_id:{type:"string"}}},
   execute:function(i){var r=PROVS.filter(function(p){if(i.provider_id&&p.id!==String(i.provider_id))return false;if(i.region&&p.region.toLowerCase()!==String(i.region).toLowerCase())return false;if(i.type&&p.type.toLowerCase().indexOf(String(i.type).toLowerCase())<0)return false;if(i.licence&&p.lic!==i.licence)return false;if(i.non_active_only&&p.lic==="A")return false;if(i.min_volume&&p.vol<i.min_volume)return false;if(i.city&&p.city.toLowerCase().indexOf(String(i.city).toLowerCase())<0)return false;return true;}).sort(function(a,b){return b.sc.final_score-a.sc.final_score||b.vol-a.vol;});
     return {count:r.length,rows:lim(r).map(function(p){return {id:p.id,type:p.type,city:p.city,region:p.region,licence:p.lic,claim_volume:p.vol,score:p.sc.final_score,risk:p.sc.risk_category,rule_hits:p.viol.map(function(v){return v.rule_id;})};})};}},
  {name:"query_members",description:"Search member profiles. Returns id, gender, age_group, city, region, policy, conditions, visits, score, risk, rule_hits.",inputSchema:{type:"object",properties:{min_visits:{type:"number"},region:{type:"string"},age_group:{type:"string"},policy:{type:"string"},condition:{type:"string",enum:["chronic","diabetes","hypertension","dyslipidemia","thyroid","cad"]},member_id:{type:"string"}}},
   execute:function(i){var key={chronic:"chronic",diabetes:"dm",hypertension:"htn",dyslipidemia:"dys",thyroid:"thy",cad:"cad"}[i.condition];var r=MEMS.filter(function(m){if(i.member_id&&m.id!==String(i.member_id))return false;if(i.min_visits&&m.visits<i.min_visits)return false;if(i.region&&m.region.toLowerCase()!==String(i.region).toLowerCase())return false;if(i.age_group&&m.age!==i.age_group)return false;if(i.policy&&m.policy.toLowerCase().indexOf(String(i.policy).toLowerCase())<0)return false;if(key&&!m[key])return false;return true;}).sort(function(a,b){return b.sc.final_score-a.sc.final_score||b.visits-a.visits;});
     return {count:r.length,rows:lim(r).map(function(m){var c=[];if(m.dm)c.push("diabetes");if(m.htn)c.push("hypertension");if(m.dys)c.push("dyslipidemia");if(m.thy)c.push("thyroid");if(m.cad)c.push("cad");return {id:m.id,gender:m.g,age_group:m.age,city:m.city,region:m.region,policy:m.policy,conditions:c,visits:m.visits,score:m.sc.final_score,risk:m.sc.risk_category,rule_hits:m.viol.map(function(v){return v.rule_id;})};})};}},
  {name:"portfolio_stats",description:"Aggregate statistics for all three datasets plus the scoring formula, rule thresholds and known dataset limitations.",inputSchema:{type:"object",properties:{}},
   execute:function(){var s=stats();return {claims:s.claims,providers:{n:s.prov.n,non_active_licence:s.prov.nonActive,extreme_volume:s.prov.extreme,elevated_volume:s.prov.elevated,flagged:s.prov.flagged,by_region:s.prov.byRegion,by_type:s.prov.byType},members:{n:s.mem.n,very_high_visits:s.mem.veryHigh,elevated_visits:s.mem.elevated,chronic:s.mem.chronic,flagged:s.mem.flagged,by_region:s.mem.byRegion,by_age:s.mem.byAge,by_policy:s.mem.byPolicy,conditions:s.mem.cond},rule_hits:s.ruleHits,
     scoring:"final = 0.40*LLM + 0.35*rule + 0.25*graph; HIGH>=70, MEDIUM>=40; a HIGH rule lifts LOW to MEDIUM; escalate only when HIGH. Rule score = max severity (HIGH 100, MEDIUM 60, LOW 30).",
     limitations:["Bulk CSV import skips the LLM and graph stages (run_llm/run_graph default false), so the maximum bulk score is 35 (MEDIUM) and nothing can escalate.","Claims carry no provider or member id, so the three files cannot be joined; duplicate billing (CHI-003), doctor shopping (CHI-010), burst billing and referral loops cannot be evaluated.","Claims carry no diagnosis, procedure or medication codes, so disease-specific rules CHI-005 to CHI-009 and most LLM checks have little to work with."],
     thresholds:{claim_high_amount:5000,claim_medium_amount:2500,claim_services:10,provider_extreme_volume:100000,provider_elevated_volume:50000,member_very_high_visits:100,member_elevated_visits:50}};}}];}
